<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="local-token" content="__LOCAL_TOKEN__"><title>KK 漫剧 · 制作面板</title><link rel="stylesheet" href="production.css"></head><body><aside><button id="connection-details" class="connection-card" aria-label="连接状态与详情"><b>连接状态</b><span><i data-light="browser"></i>浏览器<small data-state="browser">检测中</small></span><span><i data-light="codex"></i>Codex<small data-state="codex">检测中</small></span><span><i data-light="libtv"></i>LibTV<small data-state="libtv">检测中</small></span></button><nav aria-label="制作导航"></nav><footer><button id="canvas-tools">画布工具</button></footer></aside><main><header><div><span id="breadcrumb"></span><h1 id="title">漫剧库</h1></div><div class="toolbar"><span id="sync-time" class="muted">尚未同步</span><button id="sync-libtv" class="primary">同步 LibTV</button><button id="refresh">刷新面板</button><a id="full-panel" target="_blank" rel="noreferrer" hidden>完整面板 ↗</a><button id="collapse" hidden>收起</button></div></header><section id="activity-summary" class="activity-summary" aria-live="polite" hidden></section><div id="notice" role="status" hidden></div><section id="review-drafts" class="actions" aria-label="未保存的问题草稿" hidden></section><div id="content" tabindex="-1"><p class="muted">正在读取当前项目的制作记录…</p></div></main><dialog id="issue-dialog"><form id="issue-form"><h2>标记问题</h2><p id="issue-context" class="muted"></p><p id="issue-error" role="alert"></p><label>类型<select name="category"><option>动作物理</option><option>分镜衔接</option><option>声音与口型</option><option>画风与身份</option><option>其他</option></select></label><label>时间（秒）<input name="timecode" type="number" min="0" step="0.01"></label><label>问题<textarea name="description" required maxlength="2000" placeholder="描述需要返修的位置"></textarea></label><div class="actions"><button type="button" id="cancel-issue">暂存并关闭</button><button type="button" id="discard-issue">放弃草稿</button><button class="primary" type="submit">保存问题</button></div></form></dialog><dialog id="connections-dialog"><h2>连接状态</h2><div id="connections-body"></div><p class="muted">本机服务运行时持续自动更新，不必保持面板展开。新集数自动进入选集；项目目录、画布素材和个人资产自动核对，已有缓存直接使用。完整同步可立即重新核对。</p><p class="muted">服务连接只表示本地 Codex 与 LibTV 通道可用。聊天中的思考和未登记操作不会自动计为制作任务；已登记的制作任务与脚本执行可在“制作进度”查看。</p><div class="actions"><a id="monitor-link" href="/" target="_blank" rel="noreferrer">运行记录</a><button id="recheck-links">重新检测</button><button id="full-sync">完整同步</button><button id="extension-settings" hidden>连接设置</button><button id="close-connections">关闭</button></div></dialog><dialog id="request-dialog"><h2>交给 Codex 继续</h2><p id="request-copy-status" role="status"></p><textarea id="request-text" aria-label="Codex 接续说明" rows="10" readonly></textarea><div class="actions"><button id="copy-request">复制说明</button><button id="close-request">关闭</button></div></dialog><dialog id="remote-dialog"><h2 id="remote-title"></h2><div id="remote-body"></div><div class="actions"><button id="remote-issue" disabled>标记问题</button><button id="close-remote">关闭预览</button></div></dialog><script src="production.js"></script></body></html>
